[package]
name = "crc-0x8810"
version = "0.1.1"
edition = "2021"
description = "Very efficient, table-free, byte-by-byte 0x8810/0x1021 crc polynomial application"
license = "OSL-3.0"
repository = "https://github.com/codyps/crc-0x8810"
documentation = "https://docs.rs/crc-0x8810"

[dependencies]

[dev-dependencies]
crc = "3.4"
crc-any = { version = "3.1", default-features = false }
criterion = "0.8"
proptest = "1.12"

[[bench]]
name = "compare"
harness = false
